<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Activity Shield Android — test</title>
  <script src="probe.js"></script>
  <style>
    body { font: 17px/1.4 sans-serif; margin: 16px; background: #101725; color: #e6edf7; }
    button, input { display: block; box-sizing: border-box; width: 100%; min-height: 48px; margin: 14px 0; font: inherit; }
    a { color: #7dd3c5; display: block; padding: 12px 0; }
    pre { white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Activity Shield Android</h2>
  <p id="sample">This paragraph tests whether the page can read selected text.</p>
  <button id="button">Test tap</button>
  <input id="input" value="testing" aria-label="Test input">
  <a href="#sample" id="link">Long press link</a>
  <button id="fullscreen">Start fullscreen</button>
  <pre id="status"></pre>
</body>
</html>
